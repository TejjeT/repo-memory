[project]
name = "repo-memory"
version = "0.1.0"
description = "Open engineering-memory contracts, policy semantics, and reference adapters."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "TejjeT"}
]
dependencies = [
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7,<1",
  # Needed by the MCP reference server (mcp_server/) and its stdio tests.
  # Core runtime dependencies stay free of MCP SDKs.
  "mcp>=2,<3",
]
openviking = [
  "openviking-sdk>=0.1.12,<0.2"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
